# Temporary build-only variant used to validate that the site builds.
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect output
        run: |
          echo "=== publication pages ==="
          find _site/publication -type f | sort
          echo "=== homepage publication mentions ==="
          grep -o -E "SynLogic|C-Eval|Truthfulness Hyperplane|Perception Bottleneck|In-Context Sharpness|Composing Parameter-Efficient" _site/index.html | sort | uniq -c
          echo "=== homepage personal details ==="
          for term in "Junteng Liu" "jliugi@connect.ust.hk" "Vicent0205" "junteng88716710" "Zhiyuan Honor Scholarship" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Hong Kong University of Science and Technology" "Shanghai Jiao Tong University"; do
            printf "%s : %s\n" "$term" "$(grep -c "$term" _site/index.html)"
          done
          echo "=== publications page ==="
          grep -o -E "SynLogic|C-Eval|Truthfulness Hyperplane|Perception Bottleneck|In-Context Sharpness|Composing Parameter-Efficient" _site/publications/index.html | sort | uniq -c
